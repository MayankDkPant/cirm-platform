spring:
  # PROFILE ACTIVATION — environment-driven only. No profiles are activated here.
  #
  # Production / staging:
  #   SPRING_PROFILES_ACTIVE=admin
  #   (or) -Dspring.profiles.active=admin
  #
  # Local development:
  #   SPRING_PROFILES_ACTIVE=admin,local
  #   (or) -Dspring.profiles.active=admin,local
  #
  # "admin"  — enables the governance module and master-data repositories.
  # "local"  — activates mock services (ward-locator, OTP), the dev auth bypass, and
  #            LocalDevContextFilter. NEVER activate "local" in production or staging —
  #            it exposes /test/create-case, /api/v1/auth/request-otp, and unauthenticated
  #            service-request endpoints. The production OpenAPI contract (docs/openapi/)
  #            assumes admin-only activation; activating "local" contaminates the API surface.

  datasource:
    url: jdbc:postgresql://localhost:5432/cxp
    username: cirm_user
    password: cirm_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Hibernate must NEVER create tables
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8081

ward-locator:
  base-url: http://localhost:8080

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace

security:
  jwt:
    secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    access-token-expiration-minutes: 30
    refresh-token-expiration-days: 30

# Supabase authentication — JWKS-based validation (no shared secret required).
# Keys are fetched from the JWKS endpoint on first use and refreshed automatically on rotation.
supabase:
  issuer-uri: https://ubdrbsowoejluucbgwex.supabase.co/auth/v1
  jwks-uri: https://ubdrbsowoejluucbgwex.supabase.co/auth/v1/.well-known/jwks.json

# OpenAPI / Swagger UI governance.
# show-actuator: false — actuator health probes are infrastructure concerns, not platform API surface.
# Swagger UI is accessible at /swagger-ui.html (no auth required — documentation only).
# API docs JSON is at /v3/api-docs.
springdoc:
  show-actuator: false
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
